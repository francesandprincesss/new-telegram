services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=${DATABASE_URL:?DATABASE_URL is required}", "up"]
    restart: "no"

  migrate-down:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=${DATABASE_URL:?DATABASE_URL is required}", "down", "1"]
    restart: "no"

  server:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      GRPC_ADDRESS: ${GRPC_ADDRESS:-:50051}
      HTTP_ADDRESS: ${HTTP_ADDRESS:-:8080}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ISSUER: ${JWT_ISSUER:-grpc-chat}
      JWT_TTL: ${JWT_TTL:-24h}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "50051:50051"
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - server
    environment:
      CHAT_API_ORIGIN: http://server:8080
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
