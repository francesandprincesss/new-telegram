services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=${DATABASE_URL:?DATABASE_URL is required}", "up"]
    restart: "no"

  migrate-down:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=${DATABASE_URL:?DATABASE_URL is required}", "down", "1"]
    restart: "no"

  server:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      GRPC_ADDRESS: ${GRPC_ADDRESS:-:50051}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ISSUER: ${JWT_ISSUER:-grpc-chat}
      JWT_TTL: ${JWT_TTL:-24h}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "50051:50051"
    # TODO: Enable an explicit production restart policy after main starts a real server.
    restart: "no"

volumes:
  postgres-data:
